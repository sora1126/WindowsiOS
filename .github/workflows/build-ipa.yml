
name: Build WindowsiOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install dependency build tools
        run: brew install meson ninja pkg-config autoconf automake libtool gettext pcre2

      - name: Build iOS dependencies
        run: bash scripts/build_ios_deps.sh

      - name: Build Windows VM library
        run: |
          make -j2 ios-lib
          test -s build/ios/libwinvm.a
          ls -lh build/ios/libwinvm.a ios/deps/lib/

      - name: Generate Xcode project
        run: |
          cd ios
          xcodegen generate

      - name: Build app
        run: |
          xcodebuild \
            -project ios/WindowsiOS.xcodeproj \
            -scheme WindowsiOS \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/WindowsiOS.app Payload/
          zip -r WindowsiOS.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WindowsiOS-IPA
          path: WindowsiOS.ipa
